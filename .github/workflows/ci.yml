name: CI

on:
  push:
    branches: [main, agency-preservation]
  pull_request:
    branches: [main, agency-preservation]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dev dependencies
        # Include adk + proto so the full test suite (including the
        # adk-web e2e test under tests/examples/) actually runs in CI
        # rather than silently importorskip-ing. The adk-web e2e exists
        # specifically to catch regressions in the coordinator+AgentTool
        # dispatch path under real ``adk web`` — importorskip would let
        # that bug ship unnoticed, which is the opposite of the point.
        run: uv sync --extra dev --extra adk --extra proto

      - name: Ruff
        run: uv run ruff check .

      - name: Pytest
        run: uv run pytest
