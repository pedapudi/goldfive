// Goldfive v1 — control-plane wire format.
//
// goldfive owns the control proto. harmonograf (and any other external
// bridge) imports this file rather than declaring its own parallel
// ControlEvent/ControlKind/ControlAck — that parallelism has drifted
// twice already (harmonograf #34 after goldfive #83 shipped APPROVE /
// REJECT). This file is the single source of truth.
//
// Python-side: ``goldfive.control`` exposes matching ``ControlKind`` /
// ``AckResult`` / ``ControlMessage`` / ``ControlAck`` dataclasses; the
// converters in ``goldfive.conv`` round-trip between them and the
// generated messages here. See ``docs/design/CONTROL.md``.

syntax = "proto3";

package goldfive.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/pedapudi/goldfive/gen/goldfive/v1;goldfivev1";

// ---------------------------------------------------------------------------
// Enums
// ---------------------------------------------------------------------------

// Every control verb the goldfive executor understands. Bridges that
// don't understand a kind SHOULD forward it verbatim; the executor
// acknowledges unknown kinds with ``UNSUPPORTED`` rather than closing
// the channel.
enum ControlKind {
  CONTROL_KIND_UNSPECIFIED = 0;
  CONTROL_KIND_PAUSE = 1;
  CONTROL_KIND_RESUME = 2;
  CONTROL_KIND_CANCEL = 3;
  CONTROL_KIND_REWIND_TO = 4;
  CONTROL_KIND_STEER = 5;
  CONTROL_KIND_APPROVE = 6;
  CONTROL_KIND_REJECT = 7;
  CONTROL_KIND_STATUS_QUERY = 8;
  CONTROL_KIND_INTERCEPT_TRANSFER = 9;
  CONTROL_KIND_INJECT_MESSAGE = 10;
}

// Result of dispatching a ControlEvent. Every event produces exactly
// one ack; ``UNSUPPORTED`` is distinct from ``FAILURE`` so bridges can
// tell "this runner doesn't know this verb" from "the runner tried and
// it didn't work".
enum ControlAckResult {
  CONTROL_ACK_RESULT_UNSPECIFIED = 0;
  CONTROL_ACK_RESULT_SUCCESS = 1;
  CONTROL_ACK_RESULT_FAILURE = 2;
  CONTROL_ACK_RESULT_UNSUPPORTED = 3;
}

// ---------------------------------------------------------------------------
// Target
// ---------------------------------------------------------------------------

// Target for a control. ``task_id`` scopes task-level approvals;
// ``agent_id`` scopes agent-wide pause/steer/etc.; ``tool_call_id``
// scopes the ADK tool-confirmation flow.
message ControlTarget {
  string agent_id = 1;
  string task_id = 2;
  string tool_call_id = 3;
}

// ---------------------------------------------------------------------------
// Per-kind payloads
// ---------------------------------------------------------------------------

// STEER: redirect the run. See docs/design/CONTROL.md §5 for the
// delete-and-replan semantics that follow.
//
// ``author`` carries the operator identity from the originating
// annotation (goldfive#171). Bridges that don't source annotations may
// leave it empty. ``annotation_id`` carries the source annotation id
// so goldfive can dedupe retries of the same user action; bridges that
// don't source annotations may leave it empty and fall back to
// ``ControlEvent.id``-based dedupe.
message SteerPayload {
  string note = 1;
  string suggested_action = 2;
  string author = 3;
  string annotation_id = 4;
}

// REWIND_TO: reset ``task_id`` and every downstream task back to
// PENDING. Unknown task ids are acked as ``FAILURE``.
message RewindPayload {
  string task_id = 1;
}

// APPROVE: resolve a pending approval waiter identified by
// ``target_id`` (a goldfive task_id for Flow A, an ADK function-call
// id for Flow B — see docs/design/APPROVAL.md).
message ApprovePayload {
  string target_id = 1;
  string detail = 2;
}

// REJECT: reject a pending approval waiter. Mirrors ``ApprovePayload``.
message RejectPayload {
  string target_id = 1;
  string detail = 2;
}

// INJECT_MESSAGE: append a synthetic message onto the current
// conversation (e.g. a "nudge" from an operator). ``role`` is the
// chat role ("user" / "system" / ...); ``text`` is the content.
message InjectMessagePayload {
  string role = 1;
  string text = 2;
}

// ---------------------------------------------------------------------------
// Event and ack
// ---------------------------------------------------------------------------

// An operator-originated control event. ``kind`` selects the verb;
// ``payload`` (when set) carries the typed per-kind parameters.
// PAUSE / RESUME / CANCEL / STATUS_QUERY / INTERCEPT_TRANSFER carry no
// payload — the oneof is left empty for those kinds.
//
// Rationale for the typed oneof: prior revisions used ``bytes payload``
// and each consumer invented its own JSON schema. That was the biggest
// drift source. A oneof makes the wire contract self-describing.
message ControlEvent {
  string id = 1;
  google.protobuf.Timestamp issued_at = 2;
  ControlTarget target = 3;
  ControlKind kind = 4;

  oneof payload {
    SteerPayload steer = 10;
    RewindPayload rewind = 11;
    ApprovePayload approve = 12;
    RejectPayload reject = 13;
    InjectMessagePayload inject_message = 14;
  }
}

// Ack for a ControlEvent. ``control_id`` echoes the event's ``id``
// so senders can correlate. ``result`` is one of the
// ``CONTROL_ACK_RESULT_*`` values; ``detail`` is a human-readable
// explanation (always populated on FAILURE / UNSUPPORTED).
message ControlAck {
  string control_id = 1;
  ControlAckResult result = 2;
  string detail = 3;
  google.protobuf.Timestamp acked_at = 4;
}
