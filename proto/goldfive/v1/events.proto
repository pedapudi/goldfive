// Goldfive v1 — EventSink wire surface.
//
// `Event` is the envelope every goldfive EventSink receives. The oneof
// `payload` holds exactly one event-specific message. Sinks dispatch on
// the payload case and render or forward accordingly.
//
// Ordering contract: within a single run_id the `sequence` field is
// monotonically increasing and gap-free starting at 0. Sinks that batch
// or reorder must reassemble by sequence before user-visible output.
// `emitted_at` is advisory (wall clock, not monotonic) — use sequence
// for ordering.

syntax = "proto3";

package goldfive.v1;

import "google/protobuf/timestamp.proto";

import "goldfive/v1/types.proto";

option go_package = "github.com/pedapudi/goldfive/gen/goldfive/v1;goldfivev1";

// ---------------------------------------------------------------------------
// Event envelope
// ---------------------------------------------------------------------------

// Event is the uniform envelope wrapping every goldfive event. Sinks
// receive a stream of these; the `payload` oneof identifies which
// event-specific message is attached.
message Event {
  // Globally unique id for this event (UUIDv7 recommended so sinks can
  // dedupe after a reconnect without comparing payload bytes).
  string event_id = 1;
  // Run this event belongs to. A "run" is one top-level invocation of
  // the wrapped agent — same value on every event from RunStarted to
  // RunCompleted / RunAborted.
  string run_id = 2;
  // Per-run monotonic sequence starting at 0. Gap-free.
  uint64 sequence = 3;
  // Wall-clock emission time. Advisory only; use `sequence` for order.
  google.protobuf.Timestamp emitted_at = 4;
  // Session this event belongs to. Stable across all events a single
  // goldfive ``Session`` (one run / turn) produces — used by downstream
  // consumers (e.g. harmonograf) to route per-event to the correct
  // session without relying on stream-level Hello metadata. Empty string
  // means "route via the stream's Hello session" (the pre-#155 behavior);
  // populated by the Runner / Steerer / Executors for goldfive-emitted
  // events so the stream can multiplex multiple sessions.
  string session_id = 5;

  oneof payload {
    RunStarted run_started = 10;
    GoalDerived goal_derived = 11;
    PlanSubmitted plan_submitted = 12;
    PlanRevised plan_revised = 13;
    TaskStarted task_started = 14;
    TaskProgress task_progress = 15;
    TaskCompleted task_completed = 16;
    TaskFailed task_failed = 17;
    TaskBlocked task_blocked = 18;
    TaskCancelled task_cancelled = 19;
    DriftDetected drift_detected = 20;
    RunCompleted run_completed = 21;
    RunAborted run_aborted = 22;
    ConversationStarted conversation_started = 23;
    ConversationEnded conversation_ended = 24;
    ApprovalRequested approval_requested = 25;
    ApprovalGranted approval_granted = 26;
    ApprovalRejected approval_rejected = 27;
    AgentInvocationStarted agent_invocation_started = 28;
    AgentInvocationCompleted agent_invocation_completed = 29;
    DelegationObserved delegation_observed = 30;
    ReasoningJudgeInvoked reasoning_judge_invoked = 31;
    GoldfiveLLMCallStart goldfive_llm_call_start = 32;
    GoldfiveLLMCallEnd goldfive_llm_call_end = 33;
    InvocationCancelled invocation_cancelled = 34;
    TaskTransitioned task_transitioned = 35;
    TaskTransitionRefused task_transition_refused = 36;
    InvocationBoundaryEntered invocation_boundary_entered = 37;
    InvocationBoundaryExited invocation_boundary_exited = 38;
    SteeringDecisionMade steering_decision_made = 39;
    LadderTransitionDecided ladder_transition_decided = 40;
    DetectorDispatchOrdered detector_dispatch_ordered = 41;
    PolicyApplied policy_applied = 42;
    RetryBudgetSpent retry_budget_spent = 43;
    JudgementEmitted judgement_emitted = 44;
    SignalDelivered signal_delivered = 45;
    SignalOutcome signal_outcome = 46;
  }
}

// ---------------------------------------------------------------------------
// Per-event payloads
// ---------------------------------------------------------------------------

// First event on every run. The run_id here duplicates Event.run_id for
// sinks that consume payloads without the envelope; the two MUST match.
message RunStarted {
  string run_id = 1;
  // One-line natural-language description of what the user asked for,
  // suitable for a sink header or notification.
  string goal_summary = 2;
  google.protobuf.Timestamp started_at = 3;
}

// Goals the goal-derivation step produced from the user's raw input.
// Emitted once per run, before the first PlanSubmitted.
message GoalDerived {
  repeated Goal goals = 1;
}

// The planner's initial plan for the run. The plan's `revision_index`
// MUST be 0; subsequent revisions arrive as PlanRevised events.
message PlanSubmitted {
  Plan plan = 1;
}

// Minimal cross-revision diff payload attached to `PlanRevised` so
// sinks that render "what changed" can do so without re-fetching and
// diff'ing the two plans client-side. Closes PLAN-LIFECYCLE.md §8
// gap #4.
//
// Identity rules mirror PLAN-LIFECYCLE.md §3.0: a task/edge is identified
// by its id (tasks) or its (from_task_id, to_task_id) pair (edges). The
// diff is advisory — the authoritative plan lives in the enclosing
// `PlanRevised.plan` field; `diff` just saves consumers the work of
// computing the delta themselves.
message PlanRevisionDiff {
  // Task ids present in the new plan but not in the old plan.
  repeated string added_task_ids = 1;
  // Task ids present in the old plan but not in the new plan.
  repeated string removed_task_ids = 2;
  // Task ids present in both plans where at least one tracked
  // metadata field changed (title, description, assignee, status).
  // Pure status-only transitions that are already covered by the
  // Task* events are still listed here so sinks have a single
  // authoritative "modified" set keyed by task id.
  repeated string modified_task_ids = 3;
  // Edges present in the new plan but not in the old plan.
  repeated TaskEdge added_edges = 4;
  // Edges present in the old plan but not in the new plan.
  repeated TaskEdge removed_edges = 5;
}

// A revised plan, emitted by the observer in response to drift. The
// plan's `revision_index` is monotonically greater than the previous
// plan on this run. `drift_kind`, `severity`, and `reason` duplicate
// the same fields inside `plan` for sinks that want the revision
// metadata without unpacking the plan.
message PlanRevised {
  Plan plan = 1;
  DriftKind drift_kind = 2;
  DriftSeverity severity = 3;
  string reason = 4;
  uint32 revision_index = 5;
  // Minimal diff between the previous plan and `plan`. Optional for
  // back-compat with older producers; sinks that don't need the diff
  // can ignore it. Consumers that want a no-fetch "what changed" view
  // should read this field. See :class:`PlanRevisionDiff` above.
  PlanRevisionDiff diff = 6;
  // Opaque identifier of the event that triggered this revision. Always
  // non-empty on emitted ``PlanRevised`` events. Consumers dedup plan-
  // revision rows against their trigger events by exact match on this
  // field.
  //
  // Population rules (goldfive#199 / harmonograf#95 rescope):
  //   * User-control refines (USER_STEER / USER_CANCEL / USER_PAUSE):
  //     the source annotation id carried on the originating
  //     ``ControlMessage`` (goldfive#171) and mirrored on
  //     ``DriftDetected.annotation_id`` (goldfive#177).
  //   * Autonomous drift refines (LOOPING_REASONING, CONFABULATION_RISK,
  //     PLAN_DIVERGENCE, TOOL_ERROR, …): the ``DriftDetected.id`` of the
  //     drift that produced this revision.
  //   * Periodic check refines (e.g. GOAL_DRIFT classifier): the
  //     ``DriftDetected.id`` of the synthesized drift.
  //   * Validator-retry after a rejected refine attempt: the
  //     ``trigger_event_id`` of the original refine attempt (chained, not
  //     a fresh id) so both attempts dedup onto the same intervention row.
  //
  // Replaces the narrower ``annotation_id`` field from #197 (dropped as
  // a breaking change; pre-fix DB data is unsupported, see
  // harmonograf#99).
  string trigger_event_id = 7;
  // Short human-readable rendering of what goldfive sent to
  // ``planner.refine`` as context: drift detail + a summary of the prior
  // plan (task count / titles / statuses) so a Gantt / timeline can
  // explain "why was this refine requested, what did the planner see?".
  // Up to 2048 chars; longer input is truncated with " … [truncated]".
  // Empty string on producers that predate this field. Populated at the
  // ``_emit_plan_revised`` site.
  string refine_input_summary = 8;
  // Short rendering of the plan the planner returned (revision_index +
  // task titles / statuses). Up to 2048 chars with the same truncation
  // convention. Empty for producers that predate the field.
  string refine_output_summary = 9;
  // The agent the refine is steering — usually the agent that triggered
  // the drift that caused this revision (``DriftDetected.current_agent_id``).
  // Empty string for trajectory-level refines (goal-drift and any drift
  // that was not bound to a specific agent).
  string target_agent_id = 10;
  // True when this PlanRevised was emitted under observation-only mode
  // (``SteeringConfig.observation_only``): the planner produced a revised
  // plan AND every detector ran in full, but the three actual injection
  // points (``session.plan`` mutation, ``GOLDFIVE_STEER`` ControlMessage
  // enqueue, ``request_invocation_cancel`` flag) were SKIPPED. Operators
  // can use this to surface a "would-have-applied" preview lane without
  // touching the in-flight agent. False on every revision that did mutate
  // session.plan (the historical / pre-observation-only producers also
  // emit false because the field defaults to ``false``). Added in
  // goldfive#254.
  bool dry_run = 11;
}

// Task transitioned PENDING -> RUNNING.
message TaskStarted {
  string task_id = 1;
  // Optional free-text detail (e.g. the tool about to be called).
  string detail = 2;
}

// Progress update for a running task. `fraction` is [0.0, 1.0] if the
// task supports progress reporting, otherwise 0. Sinks MAY render a
// progress bar; most will surface `detail` as a live status line.
message TaskProgress {
  string task_id = 1;
  float fraction = 2;
  string detail = 3;
}

// Task transitioned RUNNING -> COMPLETED. `artifacts` is a free-form
// map of artifact name -> opaque reference (URL, digest, path, etc.);
// the framework does not interpret it, sinks surface it as-is.
message TaskCompleted {
  string task_id = 1;
  string summary = 2;
  map<string, string> artifacts = 3;
}

// Task transitioned to FAILED. `recoverable` signals whether the
// framework will request a plan revision (true) vs. abort the run
// (false).
message TaskFailed {
  string task_id = 1;
  string reason = 2;
  bool recoverable = 3;
}

// Task transitioned to BLOCKED. The framework typically follows this
// with a DriftDetected of kind DRIFT_KIND_BLOCKED.
message TaskBlocked {
  string task_id = 1;
  // Short description of what is blocking the task.
  string blocker = 2;
  // What would unblock it (a tool, an input, a human ack).
  string needed = 3;
}

// Task transitioned to CANCELLED, usually in response to user steering
// or a plan revision that dropped the task.
message TaskCancelled {
  string task_id = 1;
  string reason = 2;
}

// Observer-detected drift. Sinks surface this as a timeline marker and
// may forward it upstream (e.g. the harmonograf sink emits a
// corresponding drift annotation). Typically followed by a PlanRevised
// event once the framework produces a new plan.
message DriftDetected {
  DriftKind kind = 1;
  DriftSeverity severity = 2;
  string detail = 3;
  // Task that was running when drift was detected, if any.
  string current_task_id = 4;
  // Agent that was active when drift was detected, if any.
  string current_agent_id = 5;
  // For USER_STEER / USER_CANCEL drifts, the annotation id carried by
  // the originating ControlMessage (goldfive#171). Empty for drifts that
  // goldfive minted itself (loop detection, goal drift, etc). Sinks use
  // this to dedup the drift row against the source annotation — without
  // it a single user STEER surfaces as three cards (annotation row,
  // user_steer drift row, plan_revised row) in harmonograf's Intervention
  // view. See goldfive#176 / harmonograf#75.
  string annotation_id = 6;
  // Opaque goldfive-minted identifier for this drift, stable across
  // retries/emits. Populated for every ``DriftDetected`` (user-control
  // and autonomous). Downstream sinks use this as the strict join key
  // when a follow-up ``PlanRevised`` was triggered by an autonomous drift
  // — the ``PlanRevised.trigger_event_id`` matches this field's value.
  // See goldfive#199 / harmonograf#95 (rescope).
  string id = 7;
  // Short rendering of the data goldfive fed into the detector that
  // produced this drift — e.g. the reasoning block the LLM judge saw, the
  // activity summary shown to the goal-drift classifier, a summary of the
  // tool invocations the loop detector matched against. Up to 2048 chars;
  // longer input is truncated with the suffix " … [truncated]".
  //
  // Sinks that render a Gantt or timeline use this to answer "why did
  // goldfive flag this?" without re-fetching raw agent transcripts.
  // Optional: older producers emit "" and readers that don't know about
  // the field see zero change. Populated at the emit site on every
  // ``DriftDetected`` minted autonomously (user-control drifts preserve
  // their existing annotation semantics and may leave this empty).
  string trigger_input = 8;
  // Source attribution for the drift. One of:
  //   * ``"user"``    — minted from a ``ControlMessage`` (USER_STEER /
  //                     USER_CANCEL / USER_PAUSE).
  //   * ``"goldfive"`` — minted by a goldfive detector (reasoning judge,
  //                      embedding detectors, goal-drift, loop detectors,
  //                      tool-loops, confabulation).
  //   * ``""``        — legacy / unknown (pre-goldfive-steer-unification
  //                     producers). Readers MUST tolerate the empty
  //                     string and treat it as "not attributed".
  // Downstream UI (harmonograf) uses this to colour-code intervention
  // rows and to decide whether to surface the drift under the operator's
  // steering lane or under the judge/detector lane.
  string authored_by = 9;
  // True when a goldfive-detected drift was suppressed from promoting
  // to a steer-level intervention because a recent user-authored steer
  // is still active (see ``DefaultSteerer.goldfive_steer_suppression_window_turns``).
  // The DriftDetected row is still emitted so operators can see the
  // detector fired — but no cancel-in-flight or refine was triggered on
  // goldfive's behalf. Always ``false`` on user-authored drifts.
  bool suppressed_by_user_steer = 10;
  // Field 11 (``synthetic``) was retired in goldfive#271 Option A
  // (replaced by :meth:`DefaultSteerer.install_initial_plan` /
  // :meth:`install_revision_for_drift` /
  // :meth:`install_revision_for_user_steer` so install-path drifts
  // are no longer fabricated as USER_STEER). The field is reserved
  // so old wire bytes deserialise without failing schema validation;
  // do NOT reuse the tag.
  reserved 11;
  reserved "synthetic";
  // Stable identifier for the drift CONDITION (goldfive#271 PR1).
  // Same condition_id == same logical drift across multiple emits
  // (e.g. opened -> escalating -> resolved). Computed as
  // ``sha1(f"{kind.value}|{task_id}|{agent_id}|{turn_id}")[:16]`` so
  // a new turn always opens a fresh condition while same-turn re-
  // emits for the same kind+task+agent collapse onto one condition.
  // Distinct from ``id`` (per-event identifier carried since #199):
  // ``id`` identifies one DriftDetected emit; ``condition_id``
  // identifies the lifecycle group those emits belong to. Empty
  // string on legacy / not-yet-routed emit paths; sinks that don't
  // know the field still see one row per emit (back-compat preserved
  // — this PR is additive and does not collapse rows in harmonograf).
  string condition_id = 12;
  // Lifecycle phase at the time of this emit (goldfive#271 PR1). See
  // :enum:`DriftLifecycle`. ``DRIFT_LIFECYCLE_UNSPECIFIED`` for
  // legacy / not-yet-routed emit paths — treat as single-shot.
  DriftLifecycle lifecycle = 13;
  // Severity prior to this transition. Only meaningful when
  // ``lifecycle == DRIFT_LIFECYCLE_ESCALATING``; otherwise
  // ``DRIFT_SEVERITY_UNSPECIFIED``. Sinks rendering an "X bumped from
  // INFO -> WARNING" view read this without having to remember the
  // previous emit's severity themselves.
  DriftSeverity prev_severity = 14;
  // Plan revision the detector observed when it minted this verdict
  // (goldfive#245). Stamped at observation time from
  // ``session.plan.revision_index``, BEFORE any LLM await the
  // detector performs. Consumed by the dispatch-time gate in
  // :meth:`DefaultSteerer._handle_drift`: when the session's plan
  // revision_index has advanced past this value by the time the
  // verdict arrives, the drift is a stale observation of a
  // plan-state the system has moved past. The gate emits
  // ``DriftDetected`` for observability and skips the cancel +
  // refine machinery.
  //
  // Default ``0`` means "unset / pre-#245". Treat as a no-op for
  // gating: external producers and serialised events from older code
  // path emit ``0`` and continue to flow through the dispatch path
  // unchanged. User-authored drifts (USER_STEER / USER_CANCEL /
  // USER_PAUSE) additionally bypass the gate regardless of the stamp,
  // preserving the iter-11D / #242 contract that operator directives
  // are honoured even when the framework's plan-state cursor has
  // advanced.
  //
  // Recorded as ``int32`` for parity with
  // ``TaskTransitioned.revision_stamp``; negative values are not
  // produced.
  int32 observed_revision_index = 15;
}

// Terminal event on a successful run.
message RunCompleted {
  string outcome_summary = 1;
}

// Terminal event on an aborted run (framework-level failure, user
// cancel, or a TaskFailed with recoverable=false).
message RunAborted {
  string reason = 1;
}

// Emitted once per Conversation on the first turn that uses it. Sinks
// that render cross-turn chat history use this to open a new
// conversation context. `run_id` on the envelope is the first turn's
// run_id; `conversation_id` below is the stable identifier shared by
// every turn in the conversation.
message ConversationStarted {
  string conversation_id = 1;
  google.protobuf.Timestamp started_at = 2;
}

// Emitted when a caller invokes `Runner.new_conversation()` or closes
// the Runner. Signals that no further turns will share this
// conversation_id. `turn_count` is the number of turns that ran before
// the reset, so sinks can render "3-turn conversation ended".
message ConversationEnded {
  string conversation_id = 1;
  uint32 turn_count = 2;
  string reason = 3;
}

// ---------------------------------------------------------------------------
// Human-in-the-loop approval events
// ---------------------------------------------------------------------------

// A human yes/no is required before the run can proceed. Surfaced by:
//   * the `report_awaiting_approval` reporting tool (task-level, Flow A),
//     where `target_id` is the task id and `kind` = "task";
//   * the ADKAdapter's before_tool_callback on a `require_confirmation=True`
//     tool (tool-level, Flow B), where `target_id` is the ADK function-call
//     id and `kind` = "tool".
// Either flow resolves with a ControlMessage(APPROVE|REJECT, {"target_id": ...})
// which the executor dispatches back onto `session.pending_approvals`.
message ApprovalRequested {
  // Target the APPROVE/REJECT control must quote back: task_id for Flow A,
  // ADK function-call id (e.g. "adk-<uuid>") for Flow B.
  string target_id = 1;
  // "task" or "tool".
  string kind = 2;
  // Human-readable question the UI should render to the human ("ok to spend
  // $500?", "Run write_file(path='/etc/passwd')?").
  string prompt = 3;
  // The goldfive task context in which the approval arose. Same as
  // `target_id` for Flow A; the task the agent was working on for Flow B.
  string task_id = 4;
  // Free-form metadata. Tool-level approvals set "tool_name" and
  // "args_json"; task-level approvals may set custom keys.
  map<string, string> metadata = 5;
}

// APPROVE resolution for an ApprovalRequested. Emitted after the control
// dispatcher sets the pending-approval waiter.
message ApprovalGranted {
  string target_id = 1;
  string detail = 2;
}

// REJECT resolution for an ApprovalRequested. The agent (Flow A) decides
// whether this maps to TaskFailed; the adapter (Flow B) returns a skipped-
// tool response to the model.
message ApprovalRejected {
  string target_id = 1;
  string detail = 2;
}

// ---------------------------------------------------------------------------
// Agent dispatch / delegation observability
// ---------------------------------------------------------------------------
//
// These events are emitted by the ADK adapter's plugin lifecycle hooks when
// goldfive's registry-dispatch model routes a task to a named agent:
//
//   * AgentInvocationStarted — before_run_callback fires at the top of the
//     runner's invocation (either the top-level dispatch from goldfive or
//     a sub-Runner spawned by an AgentTool).
//   * AgentInvocationCompleted — after_run_callback fires when the runner
//     finishes.
//   * DelegationObserved — before_tool_callback fires and detects the tool
//     is an AgentTool, so the invocation is about to spawn a sub-agent.
//
// They are observability-only: they do NOT change task state and the
// framework does not interpret them. Sinks surface them to make the
// "who actually ran what" story visible (for coordinators-with-AgentTools
// especially).

// Goldfive's executor dispatched a task to an agent, or a sub-Runner was
// spawned inside an AgentTool invocation and its top-level `before_run`
// callback fired. `parent_invocation_id` is empty on top-level dispatch
// and populated for nested AgentTool-spawned invocations so sinks can
// reconstruct the delegation tree.
message AgentInvocationStarted {
  string agent_name = 1;
  string task_id = 2;
  string invocation_id = 3;
  string parent_invocation_id = 4;
  google.protobuf.Timestamp started_at = 5;
}

// Paired with AgentInvocationStarted — emitted from `after_run_callback`
// when the runner finishes. `summary` is an optional short description
// of the outcome (e.g. the final assistant text) for sinks that render
// a timeline.
message AgentInvocationCompleted {
  string agent_name = 1;
  string task_id = 2;
  string invocation_id = 3;
  string summary = 4;
  google.protobuf.Timestamp completed_at = 5;
}

// ---------------------------------------------------------------------------
// Goldfive boundary wrapper (goldfive#271 Phase 3.5 component 1)
// ---------------------------------------------------------------------------
//
// The goldfive-owned wrapper around each ADK agent invocation emits this
// pair on entry / exit. The boundary is the canonical try/finally site:
// CancelledError is caught ONLY here (Phase 3.5 hard-cancel) and
// converted to a structured exit marker so the rest of the runtime sees
// a normal return. Operators can use the pair to confirm that an
// invocation entered AND exited a goldfive boundary — a prerequisite for
// the cancellation tripwire (CancellationStashViolation) and for proper
// span lifecycle (Bug #192).
//
// Distinct from AgentInvocationStarted / AgentInvocationCompleted:
//
//   * AgentInvocation* fires when ADK reports the runner started /
//     finished (``before_run_callback`` / ``after_run_callback``).
//   * InvocationBoundary* fires at the goldfive-owned wrapper edges
//     (``before_agent_callback`` / ``after_agent_callback``'s
//     try/finally arc) — strictly AT-OR-WITHIN the AgentInvocation*
//     lifecycle but always paired even on cancel/error paths where
//     ADK's after-hooks may be skipped.
message InvocationBoundaryEntered {
  string invocation_id = 1;
  string agent_name = 2;
  string task_id = 3;
  google.protobuf.Timestamp entered_at = 4;
}

// Paired with InvocationBoundaryEntered. ``reason`` is one of
// ``"completed"`` (normal return), ``"cancelled"`` (CancelledError
// caught at the boundary and converted to a marker), or
// ``"error:<ExcName>"`` (an exception was observed and propagated
// after the finally cleanup ran).
message InvocationBoundaryExited {
  string invocation_id = 1;
  string agent_name = 2;
  string task_id = 3;
  string reason = 4;
  google.protobuf.Timestamp exited_at = 5;
}

// A tool invocation about to run is an AgentTool — the host agent is
// delegating to `to_agent`. Sinks render this as an edge from
// `from_agent` to `to_agent` in the delegation graph.
message DelegationObserved {
  string from_agent = 1;
  string to_agent = 2;
  string task_id = 3;
  string invocation_id = 4;
  google.protobuf.Timestamp observed_at = 5;

  // Optional. JSON serialisation of the AgentTool args dict the
  // coordinator invoked the sub-agent with, captured at observation
  // time. Used by the plan-descriptive-growth dedup path (see
  // ``docs/design/PLAN-DESCRIPTIVE-GROWTH.md`` §4.3.0 and §13) to
  // compute a stable identity hash from observed-fact data rather
  // than a goldfive-side intercept at pin / dispatch time.
  //
  // Forward-compat: old events without this field deserialize to
  // an empty string. PR 2's dedup falls back to per-(agent, task_id)
  // granularity when this field is empty (see §9 PR 1 row in the
  // design doc).
  //
  // JSON keeps the payload agent-agnostic and easy to hash on the
  // observer side without needing to re-serialise typed args. Producers
  // SHOULD use ``json.dumps(args, sort_keys=True)`` so equivalent
  // arg-dicts produce identical strings on the wire — the
  // normalisation in :func:`_normalize_args_tokens` is tolerant either
  // way but stable serialisation aids debug diffing.
  string tool_args_json = 6;
}

// ---------------------------------------------------------------------------
// Goldfive-as-judge observability
// ---------------------------------------------------------------------------

// Emitted by goldfive on every invocation of the LLM-as-a-judge
// reasoning-drift classifier (see
// :func:`goldfive.drift.reasoning_judge.classify_reasoning_drift`),
// regardless of verdict. Fires on both on-task and off-task outcomes
// so sinks that render a Gantt / timeline can show every judge call
// — not just the ones that produced a drift — and explain WHY a
// steering decision was or was not made.
//
// Harmonograf renders this as a span on a dedicated "goldfive" lane
// keyed on the event kind itself: no matter what ``agent_id`` the sink
// stamps on the outgoing wire, consumers treat this payload as
// originating from the goldfive library's synthetic agent identity
// (the string ``"goldfive"`` in the compound ``"<client>:goldfive"``).
message ReasoningJudgeInvoked {
  string run_id = 1;
  string task_id = 2;
  // The agent whose reasoning was judged (the agent that emitted the
  // thinking block / chain-of-thought). Empty when no agent was
  // active at judge time.
  string subject_agent_id = 3;
  // The judge model (forwarded verbatim to the configured
  // ``call_llm``). Empty when the callable substitutes its own default.
  string model = 4;
  // Wall-clock duration of the judge call in milliseconds. Advisory.
  int64 elapsed_ms = 5;
  // The reasoning / chain-of-thought the judge saw. Truncated to 4096
  // chars with the suffix " … [truncated]" when longer.
  string reasoning_input = 6;
  // The raw judge response (before JSON parsing). Truncated to 2048
  // chars with the same convention. Populated even on plumbing failures
  // (e.g. non-JSON responses) so operators can diagnose malformed
  // judge output from the wire alone.
  string raw_response = 7;

  // Parsed verdict. ``on_task = true`` means the judge said the
  // reasoning is on-track; ``on_task = false`` means a drift was
  // produced (see also the paired ``DriftDetected`` event emitted on
  // the same run_id). ``severity`` is one of "info" / "warning" /
  // "critical" when ``on_task = false``, and the empty string when
  // ``on_task = true`` (no drift severity applies). ``reason`` is the
  // judge's one-sentence explanation or empty when the judge did not
  // supply one.
  bool on_task = 8;
  string severity = 9;
  string reason = 10;

  // iter-10 three-state verdict. One of:
  //   "on_task" | "justified_deviation" | "erroneous_deviation" | ""
  // Empty string is the quiet-fail sentinel (judge raised, malformed
  // response, missing key, etc.). Mirrored on
  // ``ReasoningJudgeVerdict.classification`` (the dataclass) and on
  // every ``DriftDetected`` row paired with this judge call. ``on_task``
  // (field 8) remains the legacy boolean projection: true iff
  // ``classification == "on_task"``. PR 1 emits the field unconditionally
  // (defaults to "" until the parser starts populating it in PR 3).
  string classification = 11;

  // Parsed attribution fields, mirrored from
  // ``ReasoningJudgeVerdict`` (the in-process dataclass) so the wire
  // carries the judge's full verdict, not just the drift projection.
  // All four are populated on every emission regardless of verdict;
  // old events deserialize to ""/0.0 defaults.
  //
  // ``focused_task_id`` — the plan-task id the judge identified the
  // reasoning as actually pursuing ("" when off-plan / unattributed).
  // ``focus_confidence`` — the judge's subjective certainty in that
  // attribution, clamped to [0.0, 1.0] at parse time.
  // ``stated_intent`` — the judge's one-sentence summary of what the
  // agent says it is doing.
  // ``provenance`` — the justified-deviation provoking signal, one of
  //   "tool_error" | "surprising_result" | "discovered_dependency" |
  //   "new_information" | "" (empty unless
  //   ``classification == "justified_deviation"``; post-demotion).
  string focused_task_id = 12;
  float focus_confidence = 13;
  string stated_intent = 14;
  string provenance = 15;
}

// ---------------------------------------------------------------------------
// Goldfive-internal LLM call span (goldfive#internal-llm-spans)
// ---------------------------------------------------------------------------
//
// Emitted as a SpanStart/SpanEnd pair wrapping every goldfive-internal
// ``await call_llm(...)`` site (planner refine / generate, goal-drift
// classifier, reasoning-drift judge, goal-derive, reflective
// self-progress check, etc.). Paired by ``span_id``.
//
// Rationale: goldfive's internal LLM work — ``planner.refine`` on a drift,
// ``classify_goal_drift`` on a periodic check, ``LLMGoalDeriver.derive``
// on turn start — executes invisibly between the agent spans harmonograf
// already renders. A live session with a 3-4 minute gap between two agent
// spans (drift fires, planner refines for 45s, goal-drift judge runs for
// 15s, then the next agent starts) shows no explanation of what happened
// in that window. These events make that work visible on the goldfive
// lane as proper spans with wall-clock start/end pairs.
//
// Harmonograf renders every ``{Start, End}`` pair as a single span on the
// goldfive lane (the "<client>:goldfive" compound agent), keyed by
// ``span_id``. The ``name`` field distinguishes "refine_steer" from
// "judge_goal_drift" etc., so the frontend can label each span.

// Start marker for a goldfive-internal LLM call span.
message GoldfiveLLMCallStart {
  // Unique id for this span. Paired with the matching ``GoldfiveLLMCallEnd``.
  // UUID4 hex is fine; clients MUST emit exactly one End for each Start.
  string span_id = 1;
  // Short symbolic name of the call site (e.g. ``"refine_steer"``,
  // ``"judge_goal_drift"``, ``"plan_generate"``, ``"goal_derive"``,
  // ``"reflective_check"``, ``"judge_reasoning"``).
  string name = 2;
  // The LLM model the call was dispatched with (forwarded verbatim to
  // ``call_llm``). Empty when the callable substitutes its own default.
  string model = 3;
  // Task the span is attributed to, when available. Used by sinks that
  // want to group goldfive-internal work under the driving task on a
  // Gantt. Empty when the call is not task-scoped (e.g. initial plan
  // generation, goal-derive).
  string task_id = 4;
  // Wall-clock start time (nanoseconds since the Unix epoch, from
  // ``time.time_ns()``). Advisory only — the Event envelope's
  // ``emitted_at`` carries the authoritative emission timestamp.
  int64 start_time_ns = 5;
  // Human-readable summary of the input goldfive provided to the LLM
  // (drift detail + plan summary for refine; activity block for the
  // goal-drift judge; user_request for goal_derive; reasoning text for
  // judge_reasoning). Up to 4096 chars, truncated with
  // " … [truncated]" server-side. Empty on producers that predate the
  // field or when the call site has no meaningful input summary.
  string input_preview = 6;
  // The agent this call concerns — for a judge, the agent whose
  // reasoning was judged; for a refine, the agent owning the drifted
  // task; for a goal_derive, empty. Bare ADK name (harmonograf sink
  // canonicalizes to compound). Empty string when not applicable
  // (trajectory-level classifiers) or when no agent was active.
  string target_agent_id = 7;
  // The task this call concerns — for a judge, the task the reasoning
  // was part of; for a refine, the drifted task's id. Empty string
  // when trajectory-level (goal_drift_check) or when no task is bound.
  // Duplicates ``task_id`` above for spec parity with
  // ``GoldfiveLLMCallEnd``; consumers MAY read either and SHOULD
  // prefer ``target_task_id`` (the "spec" field; ``task_id`` predates
  // this contract and is preserved for back-compat).
  string target_task_id = 8;
}

// End marker for a goldfive-internal LLM call span. Emitted on both the
// success and exception paths so spans always close on the wire.
message GoldfiveLLMCallEnd {
  // Unique id matching the corresponding ``GoldfiveLLMCallStart``.
  string span_id = 1;
  // Echo of ``GoldfiveLLMCallStart.name`` so consumers that buffer End
  // events independently of Start events can still label them.
  string name = 2;
  // Wall-clock end time (nanoseconds since the Unix epoch, from
  // ``time.time_ns()``). Paired with ``GoldfiveLLMCallStart.start_time_ns``
  // to compute duration without re-deriving from ``emitted_at``.
  int64 end_time_ns = 3;
  // Terminal status of the wrapped call. ``"completed"`` when the
  // ``await`` returned normally; ``"failed"`` when it raised.
  string status = 4;
  // Error text when ``status == "failed"``. Empty otherwise. Truncated
  // to 1024 chars with " … [truncated]" when longer — the goal is a
  // short diagnostic, not a full traceback.
  string error = 5;
  // Echo of ``GoldfiveLLMCallStart.input_preview`` so sinks that lost
  // the Start event can still render retrospective context from the
  // End alone. Up to 4096 chars, truncated with " … [truncated]".
  // Empty on producers that predate the field.
  string input_preview = 6;
  // Human-readable summary of the decision/output goldfive produced
  // (new plan summary for refine; verdict + reason for judges; goals
  // list for goal_derive; "progressing" / "off-track" for reflective).
  // Up to 4096 chars, truncated with " … [truncated]". Only populated
  // on End (the decision isn't known at Start time). Empty on
  // producers that predate the field or when an exception raised
  // before the output could be computed.
  string output_preview = 7;
  // Echo of ``GoldfiveLLMCallStart.target_agent_id`` for End-only
  // consumers. Bare ADK name.
  string target_agent_id = 8;
  // Echo of ``GoldfiveLLMCallStart.target_task_id`` for End-only
  // consumers.
  string target_task_id = 9;
  // One-line human summary of what goldfive DID, written in active
  // voice from goldfive's perspective. Example for a refine:
  //   "refined plan in response to OFF_TOPIC drift on research_solar;
  //    produced research_solar_corrected assigned to research_agent".
  // Example for a judge:
  //   "judged research_agent's reasoning on research_solar: off-task
  //    (WARNING)".
  // Used as the Gantt bar tooltip + popover headline. Up to 512 chars,
  // truncated with " … [truncated]". Only populated on End.
  string decision_summary = 10;
}

// ---------------------------------------------------------------------------
// Cooperative cancellation (goldfive#251 Stream C)
// ---------------------------------------------------------------------------

// Emitted when a CRITICAL-severity drift or user-steer triggers
// cooperative cancellation of an agent invocation. Operator-visible
// marker — the LLM sees only ``{"status": "cancelled"}`` as the
// sub-invocation's return value (see goldfive#251 Stream C). The
// rich operator-side context (reason, severity, drift_id, drift_kind,
// detail, tool_name) lives ONLY on this sink event so it cannot leak
// into the parent agent's transcript and bias its next turn.
//
// Promoted from a dict envelope to a typed proto message (Stream C
// shipped the dict shape to avoid proto-regen scope-creep; #187 then
// added a placeholder ``harmonograf.v1.InvocationCancelled`` for
// ingest). Harmonograf-side migration onto this typed message is a
// separate Wave 2 PR (submodule bump).
message InvocationCancelled {
  // ADK ``invocation_id`` of the dispatch that was cancelled.
  string invocation_id = 1;
  // Agent the invocation was running, when known. Empty when the
  // cancel fired before the agent identity was resolvable (e.g. on
  // the ``before_run_callback`` checkpoint).
  string agent_name = 2;
  // Short symbolic reason — ``"drift"`` / ``"user_steer"`` /
  // ``"plan_revised"`` / etc. Free-form string; consumers pattern-
  // match prefixes when useful.
  string reason = 3;
  // Severity of the triggering drift, lowercased: ``"info"`` /
  // ``"warning"`` / ``"critical"``. Empty when no drift origin
  // (programmatic cancels). Recorded as a string (not the
  // ``DriftSeverity`` enum) so consumers can render it without an
  // enum lookup.
  string severity = 4;
  // Cross-reference to the triggering ``DriftEvent.id`` when the
  // cancel was minted from a drift. Empty for user-control cancels
  // or programmatic calls with no drift origin.
  string drift_id = 5;
  // Drift kind as the bare lowercase string (e.g. ``"off_topic"``).
  // Optional. Empty when no drift origin.
  string drift_kind = 6;
  // Human-readable one-line description of why cancel fired.
  // Operator-visible only; never reaches the LLM.
  string detail = 7;
  // Tool name when the cancel checkpoint fired in
  // ``before_tool_callback`` (a tool-dispatch was about to run and
  // was short-circuited). Empty for cancels detected at
  // ``before_agent_callback`` / ``before_model_callback`` where no
  // specific tool was in flight.
  string tool_name = 8;
}

// ---------------------------------------------------------------------------
// Plan-state transition observability (goldfive#251 R4)
// ---------------------------------------------------------------------------

// Emitted on EVERY successful task status transition with source
// attribution so operators can answer "who moved this task and why".
// Sink-only — the LLM's ``report_task_*`` surface still returns
// ``{"acknowledged": True}``; this event is operator observability
// (audit trail + Gantt rendering).
//
// Pairs with ``TaskTransitionRefused`` from the pin-versioning audit
// (#266): refused attempts emit that envelope and DO NOT emit
// ``TaskTransitioned`` (no transition happened). Successful
// transitions emit this typed proto envelope.
//
// ``source`` is a short symbolic vocabulary; readers MUST tolerate
// unknown values (forward-compat) and SHOULD render them as-is when
// surfacing to operators. Defined values:
//
//   * ``"llm_report"``        — driven by an LLM ``report_task_*``
//                                tool call with an explicit ``task_id``
//                                arg.
//   * ``"handler_default"``    — driven by an LLM ``report_task_*``
//                                tool call where ``task_id`` was
//                                resolved from the adapter-stamped
//                                pin (``goldfive.current_task_id``)
//                                rather than an explicit arg.
//   * ``"supersedes_reroute"`` — driven by an LLM report on a
//                                superseded task that the report-time
//                                pin classifier (#266) routed to the
//                                REPLACE-kind successor.
//   * ``"plan_revision"``      — refine changed the task's status (e.g.
//                                stamped FAILED on a looping task,
//                                CANCELLED on a supersede).
//   * ``"cancellation"``       — cooperative cancellation (#251 Stream
//                                C) transitioned a running task as a
//                                consequence (cascade-cancel from a
//                                CRITICAL drift).
//   * ``"executor_dispatch"``  — driven by an executor's framework
//                                auto-start of a task (the
//                                ``ParallelDAGExecutor.run_one`` path
//                                that flips ``task.status = RUNNING``
//                                before the adapter invoke). Distinct
//                                from ``handler_default`` (LLM tool
//                                call where ``task_id`` defaulted) and
//                                from generic ``other``.
//   * ``"control_rewind"``     — driven by a ``REWIND_TO`` control
//                                message in
//                                :mod:`goldfive.executors._control`;
//                                marks the target task and every
//                                downstream task PENDING so the
//                                executor re-walks them. One
//                                transition is emitted per affected
//                                task.
//   * ``"other"``              — any transition that doesn't match a
//                                more specific source. Operators can
//                                still surface the row; a follow-up
//                                may refine the vocabulary.
message TaskTransitioned {
  // The task that transitioned. After supersedes-reroute this is the
  // SUCCESSOR task id (the one whose status actually changed), not the
  // pin the LLM quoted.
  string task_id = 1;
  // ``TaskStatus`` enum value as the bare lowercase string (e.g.
  // ``"PENDING"``, ``"RUNNING"``, ``"COMPLETED"``). Recorded as a
  // string (not the enum) so consumers can render without a lookup
  // and so unknown future statuses round-trip without proto-regen.
  string from_status = 2;
  string to_status = 3;
  // Source attribution — see the message comment for the defined
  // vocabulary. Always non-empty on emitted events; readers MUST
  // tolerate unknown strings.
  string source = 4;
  // Plan revision in effect at transition time. Mirrors
  // ``Plan.revision_index`` of ``session.plan`` at emit time so
  // operators can correlate transitions with the revision that drove
  // them (especially useful for supersedes-reroute and plan-revision
  // sources). Recorded as ``int32`` rather than ``uint32`` for parity
  // with the existing convention in this file (e.g. revision-driven
  // counters elsewhere); negative values are not produced.
  int32 revision_stamp = 5;
  // Agent the transition was attributed to — usually
  // ``Task.assignee_agent_id`` for the transitioning task. Empty when
  // unbound (e.g. CANCELLED via cascade-from-upstream where the
  // assignee field on the cascaded task was empty). Bare ADK name
  // (harmonograf sink canonicalises to compound).
  string agent_name = 6;
  // ADK ``invocation_id`` for the dispatch that drove this transition,
  // when resolvable. Empty for transitions not tied to a specific
  // in-flight invocation (e.g. plan-revision-driven CANCELLED) and on
  // adapters that don't surface an invocation_id. Best-effort.
  string invocation_id = 7;
}

// ---------------------------------------------------------------------------
// Pin-versioning refusal observability (goldfive#266 followup)
// ---------------------------------------------------------------------------

// Emitted when the report-time pin classifier refuses to drive a
// transition because the pin is stale and either the pin's task has a
// CORRECT-kind supersedes successor (history vs. correction — the old
// task's terminal state is historical fact, the correction is a
// separate work unit) or no supersedes successor at all (ambiguity —
// an operator must disambiguate). Pairs with ``TaskTransitioned``:
// successful transitions emit that envelope, refused attempts emit
// this one and the steerer is never driven.
//
// LLM-visible response is unchanged — handlers still return
// ``{"acknowledged": True}`` so the refusal cannot become a prompt-
// injection surface (the LLM might reason against an explicit error
// payload and bypass the contract). Operators consume this event for
// the audit trail.
//
// Promoted from a dict envelope (#266 shipped the dict shape to keep
// scope tight; once #266 + #267 (typed TaskTransitioned) shipped and
// were validated, this graduated to a proper proto message — same
// pattern as the InvocationCancelled promotion in #262).
message TaskTransitionRefused {
  // Pin task_id the LLM quoted (the stale pin). After refusal the
  // steerer is NOT driven and no transition lands; this is the id the
  // LLM tried to transition.
  string task_id = 1;
  // ``TaskStatus`` enum value as the bare lowercase string the pin
  // task currently has in the plan (e.g. ``"PENDING"`` /
  // ``"RUNNING"`` / ``"COMPLETED"``). Recorded as a string for parity
  // with ``TaskTransitioned``.
  string attempted_from = 2;
  // ``TaskStatus`` enum value as the bare lowercase string the LLM
  // attempted to transition to (the target status of the
  // ``report_task_*`` call that was refused).
  string attempted_to = 3;
  // Short symbolic refusal reason. Defined values:
  //   * ``"stale_pin_correct_supersedes"`` — pin is older than the
  //     current plan revision and the pin's task has a CORRECT-kind
  //     supersedes successor.
  //   * ``"stale_pin_no_supersedes"``       — pin is older than the
  //     current plan revision and has no supersedes successor (the
  //     ambiguity case).
  // Free-form string; readers MUST tolerate unknown values for
  // forward-compat.
  string reason = 4;
  // Plan revision the pin was stamped under (the stale revision).
  // Recorded as ``int32`` for parity with
  // ``TaskTransitioned.revision_stamp``; negative values are not
  // produced.
  int32 pin_revision = 5;
  // Plan revision in effect at refusal time (the current revision
  // ``pin_revision`` is being compared against). Always strictly
  // greater than ``pin_revision`` on emitted events (a fresh pin
  // would have proceeded, not refused).
  int32 current_revision = 6;
  // Agent the refused transition was attributed to — usually the
  // assignee of the pin task. Empty when not resolvable. Bare ADK
  // name (harmonograf sink canonicalises to compound).
  string agent_name = 7;
  // ADK ``invocation_id`` for the in-flight dispatch the pin came
  // from, when resolvable. Empty when the pin lacks invocation
  // attribution. Best-effort.
  string invocation_id = 8;
}

// ---------------------------------------------------------------------------
// Steering-decision observability (zicato-optimization-surface)
// ---------------------------------------------------------------------------

// Emitted on every detector evaluation regardless of outcome. Pairs
// with ``DriftDetected``: when a detector decides to fire, both events
// emit (the ``DriftDetected.id`` matches ``SteeringDecisionMade.drift_id``);
// when a detector decides NOT to fire, only ``SteeringDecisionMade``
// emits.
//
// Downstream optimizers consume the silent-path emissions to learn
// what goldfive considered before deciding to stay quiet — without it,
// the only training signal for tuning detector thresholds is the
// positive class (drifts that fired). The negative class
// (``outcome="no_drift"``) closes the loop.
//
// ``considered_*`` fields capture what the detector evaluated; the
// ``chosen_*`` fields record what the steerer eventually applied (post
// observation-only gating, suppression-window dedup, intervention
// ladder routing). On a no-fire path the ``chosen_*`` fields echo the
// considered values when the detector's own score crossed a threshold
// but the steerer chose not to act; they are empty when the detector
// itself decided no drift was present.
message SteeringDecisionMade {
  // Symbolic name of the detector that produced this decision —
  // ``"reasoning_judge"``, ``"goal_drift"``, ``"tool_loops"``,
  // ``"capability_check"``, ``"confabulation_risk"``,
  // ``"reflective_check"``, etc. Free-form string; consumers MUST
  // tolerate unknown values.
  string detector_name = 1;
  // ``"no_drift"``         — detector ran, decided not to fire.
  // ``"drift_emitted"``    — detector fired AND the steerer dispatched
  //                          the drift (paired ``DriftDetected`` is on
  //                          the wire with matching ``drift_id``).
  // ``"drift_suppressed"`` — detector fired but the steerer suppressed
  //                          the dispatch (observation-only mode, a
  //                          fresher user-steer was active, the
  //                          drift was a stale verdict against an
  //                          already-revised plan, etc.). The paired
  //                          ``DriftDetected`` event is still emitted
  //                          for observability with the relevant
  //                          ``suppressed_*`` flag set.
  string outcome = 2;
  // One-line human-readable reason for the outcome — e.g.
  // ``"cosine 0.42 below 0.6 healthy bound"``, ``"observation_only=true"``,
  // ``"stale verdict against revision 7 (live=8)"``. Optional; empty
  // when no specific reason applies.
  string reason = 3;
  // Detector-specific scalar score that drove the decision (e.g.
  // cosine similarity for reasoning detectors, repeat-count for
  // tool-loops normalised to ``count / threshold``). 0.0 when no
  // single score summarises the decision (e.g. categorical detectors).
  float score = 4;
  // The severity the detector considered — ``"info"`` / ``"warning"``
  // / ``"critical"``, or ``""`` when no drift would have fired.
  string considered_severity = 5;
  // The severity the steerer actually applied (may differ when the
  // intervention ladder demotes / promotes the level). Empty on
  // ``no_drift`` outcomes.
  string chosen_severity = 6;
  // The intervention level the detector / steerer considered. Bare
  // lowercase string of the ``InterventionLevel`` enum
  // (``"observe"`` / ``"absorb"`` / ``"nudge"`` / ``"cancel_reinvoke"``
  // / ``"pause_escalate"`` / ``"terminate"``), or ``""`` when no
  // level was considered.
  string considered_intervention_level = 7;
  // The intervention level actually applied. Empty when no
  // intervention fired (``outcome != "drift_emitted"``).
  string chosen_intervention_level = 8;
  // Cross-reference to the paired ``DriftDetected.id`` when
  // ``outcome != "no_drift"``. Empty on the silent path.
  string drift_id = 9;
  // Wall-clock time at which the decision was finalised. Advisory; use
  // the Event envelope's ``sequence`` for ordering.
  google.protobuf.Timestamp decided_at = 10;
  // ADK invocation_id of the dispatch the decision concerns, when
  // resolvable. Empty for trajectory-level decisions (e.g. the
  // periodic goal-drift judge) and for decisions made before an
  // invocation_id is available.
  string invocation_id = 11;
  // Task the decision is attributed to, when bound. Empty when the
  // detector is trajectory-level.
  string task_id = 12;
  // Agent the decision is attributed to (the reasoning subject for
  // judge detectors; the dispatch target for tool detectors). Empty
  // when no agent is bound.
  string agent_name = 13;
}

// ---------------------------------------------------------------------------
// Decision-telemetry events (manifest-and-decision-telemetry)
//
// SteeringDecisionMade (39) records per-detector outcomes. The four
// events below record orthogonal *internal* steerer decisions that
// don't fit the per-detector frame: which intervention-ladder level
// fires for a given drift, the order detectors run in for a session,
// per-policy outcomes that have no single ``DriftKind`` to attribute,
// and per-attempt refine budget accounting. Downstream optimizers
// (zicato) consume them as features for LLM-driven analysis of
// goldfive's silent decision paths.
//
// All four events are purely additive — emission failure must NOT
// affect any caller's control flow. Sinks ignorant of the new payloads
// fall through unchanged.
// ---------------------------------------------------------------------------

// Emitted whenever the steerer's intervention ladder picks a level
// for a freshly-emitted drift. The ladder maps
// ``(DriftKind, DriftSeverity, occurrence_count)`` to an
// :class:`InterventionLevel`; this event records the input + chosen
// level so an optimizer can reconstruct the ladder table from
// telemetry alone.
//
// ``from_level`` is RESERVED and currently always emitted as ``""``.
// The intervention ladder is stateless per call (it derives the level
// purely from ``(kind, severity, occurrence_count)``), so the steerer
// does not carry a prior-level slot. Consumers that want true level
// transitions reconstruct them by joining LadderTransitionDecided rows
// on ``(drift_kind, current task)`` ordered by ``sequence`` — the
// ``reason`` field already distinguishes first-occurrence from repeat.
// The field is kept on the wire so a future stateful ladder can
// populate it without a proto change.
message LadderTransitionDecided {
  // RESERVED — always ``""`` today. See the message-level comment:
  // the ladder is stateless, so there is no prior-level slot to
  // stamp. Reconstruct transitions consumer-side via the join on
  // ``(drift_kind, task)`` ordered by ``sequence``.
  string from_level = 1;
  // Bare lowercase ``InterventionLevel`` enum name the ladder picked.
  // One of ``observe`` / ``absorb`` / ``nudge`` / ``cancel_reinvoke``
  // / ``pause_escalate`` / ``terminate``.
  string to_level = 2;
  // One-line human-readable explanation — typically
  // ``"first occurrence"`` / ``"repeat (count=N)"`` /
  // ``"severity=critical short-circuits"``.
  string reason = 3;
  // ``DriftKind`` value as ``DRIFT_KIND_*`` string (matching the
  // proto enum name so consumers can parse with ``DriftKind.Value``).
  string drift_kind = 4;
  // Cross-reference to ``DriftDetected.id`` for the drift that
  // triggered the ladder lookup.
  string drift_id = 5;
  // ``DriftSeverity`` value as ``DRIFT_SEVERITY_*`` string.
  string severity = 6;
}

// Emitted once per session (or each time the steerer recomputes the
// dispatch order — typically just at first observation) recording the
// detector dispatch ordering. The ordering is deterministic in
// goldfive today but the contract reserves the freedom to reorder /
// skip detectors based on runtime config (e.g. ``reasoning_drift_mode``
// disables embedding detectors), and an optimizer that wants to learn
// "what runs when" needs to see the snapshot rather than infer from
// fire patterns.
message DetectorDispatchOrdered {
  // Symbolic detector names in dispatch order. Names mirror those used
  // by ``SteeringDecisionMade.detector_name``.
  repeated string dispatch_order = 1;
  // One-line description of why the order is what it is — typically
  // ``"default"`` / ``"reasoning_drift_mode=disabled excludes embedding detectors"``
  // etc.
  string reason = 2;
}

// Generic policy-decision event for any steerer ``else-if`` branch
// that isn't a ``DriftDetected``. Examples: observation-only mode
// gating an emit, the same-turn dedup skipping a re-fire, the
// supersedes-integration set_session_plan path, a user-steer
// cooldown suppressing a follow-up drift. Each is a steerer policy
// that an optimizer should be able to count, not a detector-level
// signal.
message PolicyApplied {
  // Stable symbolic name of the policy — e.g.
  // ``"observation_only_gate"`` / ``"supersession_integration"`` /
  // ``"user_steer_cooldown"`` / ``"same_turn_dedup"`` /
  // ``"refine_failure_threshold"``.
  string policy_name = 1;
  // What the policy did — typically ``"applied"`` / ``"skipped"`` /
  // ``"suppressed"``. Free-form; consumers MUST tolerate unknown values.
  string outcome = 2;
  // Brief explanation for the outcome.
  string reason = 3;
  // Optional structured detail (e.g. ``"task_id=t1 count=3"``);
  // empty when no per-call detail applies.
  string detail = 4;
}

// Emitted on each refine attempt (success or failure) recording the
// per-call retry-budget state. The budget is
// ``LLMPlanner._max_refine_attempts`` (default 2); each event records
// the attempt number and how many attempts remain.
message RetryBudgetSpent {
  // Symbolic operation name — ``"refine"`` / ``"refine_user_steer"``
  // / ``"generate"`` / ``"plan_template_validate"``.
  string operation = 1;
  // 1-indexed attempt number (1 = first try).
  uint32 attempt = 2;
  // How many further attempts are allowed before the operation gives
  // up. ``0`` when this attempt exhausted the budget.
  uint32 budget_remaining = 3;
  // One-line reason / outcome — e.g. ``"call_llm raised: ..."`` on a
  // retry, ``"validated"`` on success, ``"budget_exhausted"`` after
  // the final attempt.
  string reason = 4;
}

// ---------------------------------------------------------------------------
// Pluggable judges — non-drift verdict observability (goldfive#437)
// ---------------------------------------------------------------------------

// Emitted on every :class:`Judge.evaluate` call that produced a
// populated verdict (an empty-default verdict is treated as "no
// signal" and skipped — see :mod:`goldfive.judges.base`).
//
// ``verdict_kind`` selects which of the verdict-flavour fields the
// consumer should read. The runtime picks the first populated
// flavour in the order: drift, rubric, boolean, numeric. When a
// drift-flavoured verdict fires the runtime ALSO emits the legacy
// :class:`DriftDetected` envelope so pre-judges consumers keep
// working — :class:`JudgementEmitted` is additive, not a
// replacement.
//
// Fields not relevant to the selected ``verdict_kind`` retain their
// proto-default zero values (empty string / 0.0 / false / empty
// map). Consumers MUST switch on ``verdict_kind`` rather than
// inferring the flavour from field-population heuristics so a judge
// that opts to populate ``detail`` on a numeric verdict doesn't
// confuse downstream readers.
message JudgementEmitted {
  // Stable identifier for the judge that produced this verdict —
  // the value the judge implementation sets on its ``name`` class
  // attribute. Used as the join key for per-judge time series in
  // downstream consumers. Always non-empty on emitted events.
  string judge_name = 1;
  // One of ``"drift"`` / ``"rubric"`` / ``"boolean"`` / ``"numeric"``.
  // Free-form string for forward-compat — readers MUST tolerate
  // unknown values and SHOULD surface them as-is rather than
  // dropping the event.
  string verdict_kind = 2;
  // Drift kind as the bare lowercase string (e.g. ``"off_topic"``,
  // ``"goal_drift"``). Populated when ``verdict_kind == "drift"``;
  // empty otherwise.
  string drift_kind = 3;
  // Severity as the bare lowercase string (``"info"`` /
  // ``"warning"`` / ``"critical"``). Populated for drift verdicts;
  // empty otherwise.
  string severity = 4;
  // Aggregate rubric score. Domain-defined range; goldfive does not
  // interpret the value. Populated when ``verdict_kind == "rubric"``;
  // 0.0 otherwise (the proto-default — consumers MUST gate reads on
  // ``verdict_kind``).
  float rubric_score = 5;
  // Per-dimension rubric sub-scores keyed on dimension name (e.g.
  // ``"format"``, ``"evidence_quality"``). Populated when
  // ``verdict_kind == "rubric"``; empty map otherwise.
  map<string, float> rubric_dimensions = 6;
  // Boolean pass / fail result. Populated when
  // ``verdict_kind == "boolean"``; ``false`` (the proto-default)
  // otherwise.
  bool boolean_result = 7;
  // Single numeric metric value. Populated when
  // ``verdict_kind == "numeric"``; 0.0 otherwise.
  float numeric_value = 8;
  // Name of the metric carried by ``numeric_value`` (e.g.
  // ``"cost_usd"``, ``"latency_ms"``, ``"tokens_out"``). Populated
  // when ``verdict_kind == "numeric"``; empty otherwise.
  string metric_name = 9;
  // One-line human-readable explanation. Populated on any flavour
  // when the judge has a short rationale to surface to operators
  // (Gantt tooltip / log line). Up to 512 chars on the wire;
  // producers SHOULD truncate longer rationales with the
  // " … [truncated]" convention used elsewhere in this file.
  string detail = 10;
}

// ---------------------------------------------------------------------------
// Signal telemetry — observe-only (AGENCY-PRESERVATION.md PR 5)
// ---------------------------------------------------------------------------

// Emitted at each goldfive-authored dispatch decision point the instant a
// corrective signal is — or, under ``observation_only``, *would have been* —
// delivered to the wrapped agent. The observe-only substrate for the §5.4
// shadow/differential validation: it diffs "what the legacy regime would have
// done" against "what the new regime would do" on the same real runs. Gates
// nothing.
//
// Additive (tag 45 in Event.payload); no existing field renumbered. New
// message rather than a dict envelope because signal events ride the hot
// dispatch path that ~all unit tests iterate via ``Event.WhichOneof`` — a
// dict envelope would break the "existing suites pass unmodified" invariant
// (AGENCY-PRESERVATION.md §5.1). The off-by-default ``ContextEdited`` dict
// precedent (goldfive#397) is fine only because it never lands on that path.
message SignalDelivered {
  // The goldfive-minted drift id (``DriftEvent.id``) that triggered the
  // signal. Strict join key against the paired ``DriftDetected.id``.
  string drift_id = 1;
  // Drift kind as the bare value string (e.g. ``"looping_tool_call"``).
  string kind = 2;
  // Drift severity as the bare value string (``"info"`` / ``"warning"`` /
  // ``"critical"``).
  string severity = 3;
  // The dispatch decision point the signal rode: ``"nudge_replay"`` /
  // ``"steer_control"`` / ``"pause_control"`` / ``"promotion"``. Readers MUST
  // tolerate unknown values for forward-compat.
  string channel = 4;
  // Logical-turn stamp on the goldfive#441 ``Session._reasoning_turn`` clock
  // at delivery time. The clock PR 8's grace window is measured on.
  int32 turn = 5;
  // The observation+goal advisory note (PR 4 ``observer_notes``) the agent
  // would read. The agent-facing wire surface ``types.py`` defers to "the PR 5
  // telemetry pass".
  string note_text = 6;
  // True when the steering injection gate was shut
  // (``DefaultSteerer._should_inject() == not observation_only``) — i.e. the
  // signal carried no production authority. The §5.4 shadow-mode flag: an
  // ``observation_only`` run records every signal ``dry_run=true``,
  // establishing the agent self-correction base rate before behavior changes.
  bool dry_run = 7;
  // Bound goldfive task id (``Task.id``) — stable, never LLM-minted.
  string task_id = 8;
  // Bound agent id (``DriftEvent.current_agent_id``).
  string agent_id = 9;
  // The differential-validation payload: a JSON object string carrying what
  // the dispatch path already computed — ``ladder_level``,
  // ``occurrence_count``, ``promotion``, ``observation_only``,
  // ``would_cancel_inflight`` (PR 1's cancel-authority verdict),
  // ``channel_action`` (the mechanical "queued"/"dispatched"/"suppressed"
  // truth), and channel-specific extras (plan-swap ``superseded_task_ids`` /
  // ``replacement_task_ids`` the legacy regime would have steered toward).
  // A string (not a nested message) so the field set can iterate against real
  // traffic without a proto regen per added key; consumers ``json.loads`` it.
  string decision_json = 10;
}

// Emitted once — and only once — per ``(drift_kind, task_id)`` SignalLedger
// key that carried at least one delivered signal, when the key reaches a
// terminal observation. The companion to ``SignalDelivered``: together they
// let the §5.4 report estimate the self-correction base rate and the
// post-signal drift re-fire rate. Gates nothing. Additive (tag 46).
message SignalOutcome {
  // Drift kind as the bare value string.
  string drift_kind = 1;
  // Bound goldfive task id.
  string task_id = 2;
  // One of ``"self_corrected_unaided"`` (task resolved; key carried only
  // dry-run deliveries — the base-rate case), ``"self_corrected_after_signal"``
  // (task resolved; >=1 real delivery), ``"escalated"`` (key escalated to a
  // pause), ``"user_intervened"`` (USER_STEER/CANCEL arrived while open), or
  // ``"invocation_ended"`` (run ended with the key still open — the
  // conservative catch-all). Readers MUST tolerate unknown values.
  string outcome = 3;
  // Logical turns from first observation to resolution on the
  // ``Session._reasoning_turn`` clock (clamped >= 0).
  int32 turns_to_resolution = 4;
  // Number of deliveries recorded on the key (dry-run + real).
  int32 delivery_count = 5;
  // True when at least one non-dry-run signal was delivered on the key.
  bool had_real_delivery = 6;
  // Optional one-line human-readable detail.
  string detail = 7;
}
