[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "goldfive"
version = "0.1.0"
description = "Agent orchestration: stay on target."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Sunil Pedapudi" },
]
keywords = ["agents", "orchestration", "planning", "llm", "drift", "steering", "adk", "anthropic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
adk = [
    "google-adk>=0.1.0",
]
claude = [
    "anthropic>=0.39.0",
]
# claude-agent-sdk integration (``goldfive.integrations.claude_sdk``).
# Min version 0.1.80 is the first that ships the documented
# ``permissionDecision="defer"`` + ``ResultMessage.deferred_tool_use``
# contract the ``ClaudeAgentSDKLlm`` BaseLlm adapter relies on
# (claude_agent_sdk/types.py:415 for the literal; types.py:1131 for
# ``DeferredToolUse``). Earlier 0.1.x versions silently ignored
# unknown ``permissionDecision`` values, which would surface as
# "tool stuck pending permission" instead of the clean defer path.
claude_sdk = [
    "claude-agent-sdk>=0.1.80",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "protobuf>=4.25",
    "grpcio-tools>=1.60",
]
embedding = [
    "sentence-transformers>=3.0",
]
examples = [
    "rich>=13.0",
]
proto = [
    "grpcio>=1.60",
    "grpcio-tools>=1.60",
    "mypy-protobuf>=3.5",
]

[project.urls]
Homepage = "https://github.com/pedapudi/goldfive"
Repository = "https://github.com/pedapudi/goldfive"
Issues = "https://github.com/pedapudi/goldfive/issues"
Changelog = "https://github.com/pedapudi/goldfive/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
include = [
    "goldfive",
    "goldfive/pb",
    "goldfive/py.typed",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["goldfive/pb"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
