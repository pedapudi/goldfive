# ---------------------------------------------------------------------------
# Reasoning-drift numeric thresholds
# ---------------------------------------------------------------------------

[[mutation]]
id = "off_topic_distance_threshold"
kind = "numeric"
source = "goldfive/drift/reasoning.py:OFF_TOPIC_DISTANCE_THRESHOLD"
python_attr = "goldfive.drift.reasoning:OFF_TOPIC_DISTANCE_THRESHOLD"
description = "Cosine-distance threshold above which a reasoning block is flagged OFF_TOPIC."
type = "float"
range = [0.0, 1.0]
default = 0.7
tags = ["threshold", "reasoning", "off_topic"]

[[mutation]]
id = "looping_reasoning_similarity_threshold"
kind = "numeric"
source = "goldfive/drift/reasoning.py:LOOPING_REASONING_SIMILARITY_THRESHOLD"
python_attr = "goldfive.drift.reasoning:LOOPING_REASONING_SIMILARITY_THRESHOLD"
description = "Cosine-similarity threshold above which a reasoning block is flagged LOOPING_REASONING."
type = "float"
range = [0.5, 0.999]
default = 0.9
tags = ["threshold", "reasoning", "looping"]

[[mutation]]
id = "reasoning_cluster_similarity_threshold"
kind = "numeric"
source = "goldfive/drift/reasoning.py:REASONING_CLUSTER_SIMILARITY_THRESHOLD"
python_attr = "goldfive.drift.reasoning:REASONING_CLUSTER_SIMILARITY_THRESHOLD"
description = "Lower-tier cosine-similarity threshold for the REASONING_CLUSTER_TIGHTENING early-warning signal."
type = "float"
range = [0.4, 0.95]
default = 0.75
tags = ["threshold", "reasoning", "cluster"]

[[mutation]]
id = "looping_reasoning_hash_window"
kind = "numeric"
source = "goldfive/drift/reasoning.py:LOOPING_REASONING_HASH_WINDOW"
python_attr = "goldfive.drift.reasoning:LOOPING_REASONING_HASH_WINDOW"
description = "Number of prior reasoning blocks to compare against when checking for loops."
type = "int"
range = [2, 50]
default = 5
tags = ["threshold", "reasoning", "looping"]

[[mutation]]
id = "intent_divergence_healthy_similarity"
kind = "numeric"
source = "goldfive/drift/reasoning.py:INTENT_DIVERGENCE_HEALTHY_SIMILARITY"
python_attr = "goldfive.drift.reasoning:INTENT_DIVERGENCE_HEALTHY_SIMILARITY"
description = "Cosine-similarity above which reasoning vs. goals/task is considered healthy (no INTENT_DIVERGENCE drift)."
type = "float"
range = [0.0, 1.0]
default = 0.6
tags = ["threshold", "reasoning", "intent_divergence"]

[[mutation]]
id = "intent_divergence_minor_similarity"
kind = "numeric"
source = "goldfive/drift/reasoning.py:INTENT_DIVERGENCE_MINOR_SIMILARITY"
python_attr = "goldfive.drift.reasoning:INTENT_DIVERGENCE_MINOR_SIMILARITY"
description = "Lower bound for INFO-tier INTENT_DIVERGENCE. Below this and above WARNING bound, WARNING fires."
type = "float"
range = [0.0, 1.0]
default = 0.4
tags = ["threshold", "reasoning", "intent_divergence"]

[[mutation]]
id = "intent_divergence_warning_similarity"
kind = "numeric"
source = "goldfive/drift/reasoning.py:INTENT_DIVERGENCE_WARNING_SIMILARITY"
python_attr = "goldfive.drift.reasoning:INTENT_DIVERGENCE_WARNING_SIMILARITY"
description = "Lower bound for WARNING-tier INTENT_DIVERGENCE. Below this, CRITICAL fires."
type = "float"
range = [0.0, 1.0]
default = 0.2
tags = ["threshold", "reasoning", "intent_divergence"]

[[mutation]]
id = "sentence_level_min_block_length"
kind = "numeric"
source = "goldfive/drift/reasoning.py:SENTENCE_LEVEL_MIN_BLOCK_LENGTH"
python_attr = "goldfive.drift.reasoning:SENTENCE_LEVEL_MIN_BLOCK_LENGTH"
description = "Minimum character length for OFF_TOPIC's per-sentence sub-pass to engage."
type = "int"
range = [50, 4000]
default = 200
tags = ["threshold", "reasoning", "off_topic"]

[[mutation]]
id = "sentence_level_max_sentences"
kind = "numeric"
source = "goldfive/drift/reasoning.py:SENTENCE_LEVEL_MAX_SENTENCES"
python_attr = "goldfive.drift.reasoning:SENTENCE_LEVEL_MAX_SENTENCES"
