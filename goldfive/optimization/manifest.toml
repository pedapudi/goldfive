# ---------------------------------------------------------------------------
# Expansion: plan-template fragments (manifest-and-decision-telemetry)
# ---------------------------------------------------------------------------
#
# The two supersession fragments are embedded verbatim into every refine
# system prompt (refine / user_steer / looping_tool_call / plan_divergence)
# via string concatenation. They shape the JSON output template the
# planner is constrained to emit -- tuning here moves the precision /
# recall of supersession detection without touching any drift-specific
# prompt body.

[[mutation]]
id = "plan_template_supersession_invariant"
kind = "prompt"
source = "goldfive/optimization/prompts/plan_template_supersession_invariant.md"
python_attr = "goldfive.planner:_SUPERSESSION_INVARIANT"
description = "Reuse-or-supersede invariant embedded in every refine system prompt."
required_placeholders = []
tags = ["planner", "template", "supersession"]

[[mutation]]
id = "plan_template_supersession_examples"
kind = "prompt"
source = "goldfive/optimization/prompts/plan_template_supersession_examples.md"
python_attr = "goldfive.planner:_SUPERSESSION_EXAMPLES"
description = "Few-shot REPLACE/EVOLUTION examples anchoring the supersession invariant."
required_placeholders = []
tags = ["planner", "template", "supersession"]

[[mutation]]
id = "plan_template_refinement_guidance"
kind = "prompt"
source = "goldfive/optimization/prompts/plan_template_refinement_guidance.md"
python_attr = "goldfive.planner:_REFINEMENT_GUIDANCE_BLOCK"
description = "Default-pattern refinement guidance ('small drift -> swap drifted task with supersedes; reshape only when needed') embedded in the refine prompts."
required_placeholders = []
tags = ["planner", "template", "refine"]

