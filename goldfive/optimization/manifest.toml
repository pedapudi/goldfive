# Goldfive steering-optimization manifest.
#
# This file is the source-of-truth inventory of every knob downstream
# optimizers (e.g. pedapudi/zicato) are allowed to mutate on goldfive's
# steering path. Each entry describes ONE mutation target — a prompt
# body or a numeric threshold — with enough metadata for the optimizer
# to:
#
#   * resolve the live current value (via ``source``);
#   * validate a proposed new value against per-entry constraints;
#   * group related entries (via ``tags``) when sweeping.
#
# Source paths
# ------------
# ``source`` carries one of two shapes:
#
#   * ``goldfive/optimization/prompts/<name>.md`` — points at the
#     markdown copy of the prompt. The live runtime value is the
#     Python attribute named in ``python_attr``; the markdown file is
#     the optimizer-facing canonical text.
#   * ``goldfive/<module>.py:<ATTR>`` — points at a module-level Python
#     attribute that the optimizer mutates with ``setattr``.
#
# Numeric ``range`` is ``[low, high]`` inclusive. Defaults track the
# repo's current value at manifest authorship time and are kept in
# sync by tests in ``tests/test_optimization_manifest.py`` so a code-
# side bump does not silently drift the manifest's notion of default.
#
# Adding a knob: append an entry here and add the corresponding
# coverage row in ``tests/test_optimization_manifest.py``.

