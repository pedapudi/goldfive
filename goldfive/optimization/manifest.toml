source = "goldfive/drift/_embed.py:_RUNTIME_FAILURE_THRESHOLD"
python_attr = "goldfive.drift._embed:_RUNTIME_FAILURE_THRESHOLD"
description = "Consecutive embedding-backend failures before the circuit-breaker trips and the detectors degrade to no-signal."
type = "int"
range = [1, 50]
default = 3
tags = ["threshold", "embed", "circuit_breaker"]

[[mutation]]
id = "embed_cache_max"
kind = "numeric"
source = "goldfive/drift/_embed.py:_CACHE_MAX"
python_attr = "goldfive.drift._embed:_CACHE_MAX"
description = "LRU cache size (entries) for per-text encoded vectors. Lower cuts memory, higher cuts redundant encoding cost."
type = "int"
range = [16, 16384]
default = 512
tags = ["embed", "cache"]

[[mutation]]
id = "processed_steer_ids_cap"
kind = "numeric"
source = "goldfive/state_store.py:PROCESSED_STEER_IDS_CAP"
python_attr = "goldfive.state_store:PROCESSED_STEER_IDS_CAP"
description = "FIFO cap on the per-session processed-STEER annotation_id dedup set. Above the cap the oldest ids are evicted."
type = "int"
range = [16, 16384]
default = 256
tags = ["state_store", "dedup", "cap"]

