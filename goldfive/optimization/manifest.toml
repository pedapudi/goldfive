python_attr = "goldfive.adapters.adk_llm_instrumentation:DEFAULT_AGENT_MAX_OUTPUT_TOKENS"
description = "Default per-agent output-token cap installed on the ADK plugin's LLM-call shim when AgentConfig does not override."
type = "int"
range = [256, 131072]
default = 16384
tags = ["adapter", "prompt_budget"]

