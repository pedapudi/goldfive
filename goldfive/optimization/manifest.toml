[[mutation]]
id = "default_llm_call_timeout_ms"
kind = "numeric"
source = "goldfive/adapters/_adk_plugin.py:DEFAULT_LLM_CALL_TIMEOUT_MS"
python_attr = "goldfive.adapters._adk_plugin:DEFAULT_LLM_CALL_TIMEOUT_MS"
description = "Wall-clock budget (ms) before the ADK plugin's LLM-call watcher emits an LLM_CALL_TIMEOUT drift and flags the invocation for cancel. 0 disables the watcher."
type = "int"
range = [0, 7200000]
default = 1800000
tags = ["adapter", "cooldown", "timeout"]

[[mutation]]
id = "default_agent_max_output_tokens"
